name: Build unsigned iOS IPA (for local sideload signing)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk space
        run: |
          df -h /
          sudo rm -rf /Applications/Xcode_16*.app /Applications/Xcode_15*.app 2>/dev/null || true
          xcrun simctl delete unavailable 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Caches 2>/dev/null || true
          rm -rf ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true
          rm -rf ~/Library/Developer/Xcode/Archives 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h /
      - name: Clear SPM cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
      - name: Build unsigned .app for iOS
        run: |
          xcodebuild \
            -project Yattee.xcodeproj \
            -scheme Yattee \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
      - name: Package as unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 1 -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Yattee-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: yattee-unsigned-ipa
          path: Yattee-unsigned.ipa
          if-no-files-found: error
